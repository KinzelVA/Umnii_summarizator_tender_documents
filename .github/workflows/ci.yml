name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build Docker image
        run: docker build -t tender-document-summarizer:ci .

      - name: Run container health check
        run: |
          docker run -d \
            --name tender-summarizer-ci \
            -p 8000:8000 \
            tender-document-summarizer:ci

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "Container health check passed."
              exit 0
            fi

            sleep 1
          done

          echo "Container health check failed."
          docker logs tender-summarizer-ci
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f tender-summarizer-ci || true