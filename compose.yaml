services:
  api:
    build:
      context: .
    image: tender-document-summarizer:dev
    container_name: tender-summarizer

    ports:
      - "8000:8000"

    environment:
      TENDER_LOG_LEVEL: INFO
      TENDER_MAX_PDF_SIZE_MB: "20"

      TENDER_OLLAMA_BASE_URL: http://host.docker.internal:11434
      TENDER_OLLAMA_MODEL: gpt-oss:20b
      TENDER_OLLAMA_CONTEXT_LENGTH: "16384"
      TENDER_LLM_TIMEOUT_SECONDS: "120"

      TENDER_RATE_LIMIT_REQUESTS: "10"
      TENDER_RATE_LIMIT_WINDOW_SECONDS: "60"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped